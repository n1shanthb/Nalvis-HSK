name: tests
on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: bash scripts/check-rules.sh
      - run: forge test -vvv
        working-directory: contracts
      - run: forge coverage --report summary --no-match-coverage '(src/lib/(TickMath|FullMath)\.sol|test/|script/)'
        working-directory: contracts
      - run: forge build --sizes
        working-directory: contracts
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
        env:
          VITE_ENABLE_OWNER: "true"
          VITE_DEMO_MODE: "false"
      - run: pnpm test
